name: Update Last Updated Timestamp

on:
  push:
    branches:
      - main

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamps in HTML files
        run: |
          # Get current date and time in IST format "DD Mon YYYY, HH:MM AM/PM"
          export TZ='Asia/Kolkata'
          CURRENT_DATETIME=$(date '+%d %b %Y, %I:%M %p')

          # Find all HTML files excluding .git directory
          find . -name "*.html" -not -path "./.git/*" | while read -r file; do
            # Replace content inside <span id="lastUpdated">...</span>
            sed -i "s|<span id=\"lastUpdated\">[^<]*</span>|<span id=\"lastUpdated\">$CURRENT_DATETIME</span>|g" "$file"
          done

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update last-updated timestamp [skip ci]"
          git push
